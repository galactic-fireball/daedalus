[project]
name = "daedalus"
version = "0.1.0"
description = "A tool for building JWST products"
authors = [
    {name = "galactic-fireball",email = "sdoan1@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "toml (>=0.10.2,<0.11.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "astropy (>=7.2.0,<8.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "photutils (>=2.3.0,<3.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "opencv-python-headless (==4.11.0.86)",
    "jwst (>=1.20.2,<2.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "pathlib (>=1.0.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
